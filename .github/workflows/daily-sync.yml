name: Denná synchronizácia transakcií

on:
  # Denné spúšťanie zabezpečuje cron-job.org cez GitHub API (workflow_dispatch),
  # nastavené na 06:00 v pásme Europe/Bratislava – postup je v README.
  workflow_dispatch:
    inputs:
      days:
        description: "Počet dní vrátane dneška (2 = včera a dnes)"
        default: "2"

concurrency: bank-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Konfigurácia zo secretu
        run: printf '%s' "$CONFIG_YAML" > config.yaml
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}

      - name: Synchronizácia
        run: python -m bank_sync sync --days "$DAYS"
        env:
          DAYS: ${{ inputs.days || '2' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ENABLEBANKING_PRIVATE_KEY: ${{ secrets.ENABLEBANKING_PRIVATE_KEY }}
          # Pre každý Fio účet jeden riadok – názov musí sedieť s token_env v konfigurácii.
          FIO_TOKEN_1: ${{ secrets.FIO_TOKEN_1 }}
          FIO_TOKEN_2: ${{ secrets.FIO_TOKEN_2 }}
          FIO_TOKEN_3: ${{ secrets.FIO_TOKEN_3 }}
